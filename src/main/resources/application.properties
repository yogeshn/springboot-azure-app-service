# Application Properties for Spring Boot 3.x (Java 17 compatible)

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Application
spring.application.name=my-application

# JPA / Database (assuming H2 for example, preserve existing if any)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging (updated for Spring Boot 3, if deprecated logging properties existed, migrate to these)
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n