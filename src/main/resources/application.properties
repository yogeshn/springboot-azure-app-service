server.port=8080
spring.application.name=helloazure
spring.profiles.active=dev

# Logging configuration for robustness and error tracking
logging.level.root=INFO
logging.level.com.amock.helloazure=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/helloazure.log

# Server error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Spring Boot actuator for health checks (if needed for production robustness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Database configuration (placeholder; adjust if JPA/Hibernate is used)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true

# No deprecated properties used; compatible with Spring Boot 3.x and Java 17+