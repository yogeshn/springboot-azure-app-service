# Test-specific application configuration for Spring Boot 3.x
# This configuration overrides application.yml for test profiles
# No deprecated properties detected; all properties are compatible with Spring Boot 3.x
# Preserves existing configurations for datasource, JPA, and logging in test environment

spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 2000
  thymeleaf:
    cache: false
  security:
    user:
      name: testuser
      password: testpass

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    org.springframework.web: DEBUG
    com.example: DEBUG  # Assuming package name; adjust as per application
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

# Test-specific server configuration
server:
  port: 0  # Random port for tests
  servlet:
    context-path: /  # Compatible with Spring Boot 3.x

# Any custom test properties
app:
  test-mode: true
  max-upload-size: 10MB