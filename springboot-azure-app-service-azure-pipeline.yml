trigger:
- main

pool:
  vmImage: ubuntu-22.04

variables:
  MAVEN_OPTS: '-Dserver.port=9093'

steps:
- task: UseJavaVersion@1
  displayName: 'Use JDK 21'
  inputs:
    versionSpec: '21'
    architecture: 'x64'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: mvn dependency:resolve -B
  displayName: 'Resolve Maven dependencies'

- script: mvn compile -q
  displayName: 'Compile application'

- script: mvn test -B
  displayName: 'Run tests'
